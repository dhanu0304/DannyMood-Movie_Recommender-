<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DannyMood - Movie Recommender</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

  <!-- ════════════════════════════════════════
       NAVBAR
       ════════════════════════════════════════ -->
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="navbar__inner">

      <span id="logo" role="link" tabindex="0" aria-label="DannyMood home">DannyMood</span>

      <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <div id="nav-panel" class="nav-panel">
        <div class="nav-links" role="list">
          <button class="nav-link active" data-view="home" type="button">Home</button>
          <button class="nav-link" data-view="moods" type="button">Moods</button>
          <button class="nav-link" data-view="genres" type="button">Genres</button>
          <button class="nav-link" data-view="countries" type="button">Countries</button>
          <button class="nav-link" data-view="years" type="button">Years</button>
          <button class="nav-link" data-view="movies" type="button">Movies</button>
          <button class="nav-link" data-view="tv" type="button">TV Series</button>
          <button class="nav-link" data-view="browse" type="button">Browse</button>
          <button class="nav-link" data-view="watchlist" type="button">
            Watchlist <span id="watchlist-count">0</span>
          </button>
        </div>
      </div>

      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">&#128269;</span>
        <input
          type="search"
          id="search-input"
          placeholder="Search movies, moods, or genres..."
          autocomplete="off"
          aria-label="Search movies"
        />
      </div>

    </div>
  </nav>


  <!-- ════════════════════════════════════════
       MAIN PAGE CONTENT
       ════════════════════════════════════════ -->
  <main>

    <!-- Demo Data Banner (shown when API key is not set) -->
    <div id="demo-banner" style="display: none;">
      <div class="demo-banner__inner">
        <div>
          <strong>Showing Demo Data</strong>
          <p>Set your TMDB API key in .env to see live movies.</p>
        </div>
      </div>
    </div>


    <!-- ── HOME VIEW ───────────────────────────
         Shown by default. Hidden during search.
    ───────────────────────────────────────────── -->
    <div id="home-view">

      <!-- HERO SECTION: Big featured movie banner -->
      <section class="hero hero--loading" id="hero-section" aria-label="Featured movie">

        <!-- Background image (filled by JavaScript) -->
        <img class="hero__bg" id="hero-bg" src="" alt="Featured movie backdrop" />

        <!-- Gradient overlays for readability -->
        <div class="hero__gradient-side"   aria-hidden="true"></div>
        <div class="hero__gradient-bottom" aria-hidden="true"></div>

        <!-- Movie info text -->
        <div class="hero__content">
          <div class="hero__info">
            <span class="hero__label">FEATURED</span>
            <h1 id="hero-title"></h1>
            <p  id="hero-summary"></p>

            <div class="hero__buttons">
              <button class="btn-gold" id="hero-explore-btn">
                &#9654; Explore
              </button>
              <button class="btn-gold" id="surprise-me-btn" title="Get a random movie recommendation">
                🎲 Surprise Me
              </button>
              <button class="btn-ghost" onclick="document.getElementById('mood-chips').scrollIntoView({behavior:'smooth'})">
                &#10024; Browse Moods
              </button>
            </div>
          </div>
        </div>
      </section>


      <!-- MOOD SELECTOR: Pick a mood to filter movies -->
      <section class="mood-section" aria-label="Filter by mood">
        <div class="section-heading">
          <div>
            <h2 class="section-title">How are you feeling?</h2>
            <p class="mood-section__hint">Choose one mood or blend a few together.</p>
          </div>
          <button id="clear-moods-btn" class="text-btn" type="button">Clear All</button>
        </div>
        <div id="mood-chips" role="group" aria-label="Mood filters"></div>
        <div id="active-moods" class="active-moods" aria-live="polite"></div>
        <div id="recent-moods" class="recent-moods"></div>
      </section>


      <!-- MOVIE ROWS: Trending, Popular, Top Picks -->
      <!-- Filled dynamically by main.js -->
      <div id="rows-container" aria-live="polite"></div>

    </div><!-- end #home-view -->


    <!-- ── SEARCH VIEW ──────────────────────────
         Shown when user types in the search bar.
    ───────────────────────────────────────────── -->
    <div id="search-view" aria-live="polite">

      <div class="search-view__header">
        <!-- Back button: returns to the homepage -->
        <button id="back-btn" aria-label="Back to home">
          &larr; Back to Home
        </button>
        <h2 id="search-title"></h2>
      </div>

      <!-- Search results grid (filled by main.js) -->
      <div id="search-results"></div>

    </div><!-- end #search-view -->

    <div id="watchlist-view" aria-live="polite">
      <div class="search-view__header">
        <button id="watchlist-back-btn" class="back-btn" aria-label="Back to home">
          &larr; Back to Home
        </button>
        <h2>My Watchlist</h2>
        <div class="watchlist-controls">
          <button class="watchlist-sort-btn active" data-sort="added" title="Sort by recently added">
            📅 Recently Saved
          </button>
          <button class="watchlist-sort-btn" data-sort="rating" title="Sort by rating">
            ⭐ By Rating
          </button>
          <button class="watchlist-sort-btn" data-sort="release" title="Sort by release date">
            📽️ By Release Date
          </button>
          <button class="watchlist-sort-btn" data-sort="alpha" title="Sort alphabetically">
            🔤 A-Z
          </button>
        </div>
      </div>
      <div id="watchlist-stats" class="watchlist-stats"></div>
      <div id="watchlist-results"></div>
    </div>

    <div id="explorer-view" class="explorer-view" aria-live="polite">
      <header class="explorer-header">
        <span id="explorer-kicker">DISCOVER</span>
        <h1 id="explorer-title">Browse</h1>
        <p id="explorer-description"></p>
      </header>
      <div id="explorer-controls"></div>
      <div id="explorer-results"></div>
    </div>

  </main>


  <!-- ════════════════════════════════════════
       MOVIE DETAIL MODAL
       Hidden by default. Opens when you click a movie card.
       ════════════════════════════════════════ -->
  <div
    id="movie-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
  >
    <div class="modal__box">

      <!-- Movie backdrop image at the top -->
      <div class="modal__backdrop">
        <img id="modal-bg" src="" alt="Movie backdrop" />
        <div class="modal__backdrop-gradient" aria-hidden="true"></div>
      </div>

      <!-- Close (X) button -->
      <button id="modal-close-btn" aria-label="Close modal">&times;</button>

      <!-- Modal body: movie info + trailer -->
      <div class="modal__body">

        <!-- Meta row: year, genre, rating badge, vote score -->
        <div class="modal__meta">
          <span class="meta-tag" id="modal-year"></span>
          <span class="meta-tag" id="modal-genre"></span>
          <span id="modal-rating"></span>
          <span id="modal-vote"></span>
        </div>

        <!-- Movie title -->
        <h2 id="modal-title"></h2>

        <!-- Summary / overview -->
        <p id="modal-tagline"></p>
        <p id="modal-summary"></p>
        <div id="modal-runtime"></div>

        <!-- Mood tags -->
        <div id="modal-mood" aria-label="Movie moods"></div>

        <!-- OTT availability -->
        <div id="modal-ott" aria-label="OTT availability"></div>

        <!-- YouTube trailer embed -->
        <div id="trailer-area" aria-label="Movie trailer"></div>

        <section class="modal-section" aria-labelledby="reviews-heading">
          <h3 id="reviews-heading">Reviews</h3>
          <div id="modal-reviews"></div>
        </section>

        <section class="modal-section" aria-labelledby="cast-heading">
          <h3 id="cast-heading">Cast</h3>
          <div id="modal-cast"></div>
        </section>

        <section class="modal-section" aria-labelledby="similar-heading">
          <h3 id="similar-heading">More Like This</h3>
          <div id="modal-similar"></div>
        </section>

      </div><!-- end modal__body -->

    </div><!-- end modal__box -->
  </div><!-- end #movie-modal -->


  <!-- ════════════════════════════════════════
       JAVASCRIPT
       ════════════════════════════════════════ -->
  <script src="/static/js/main.js"></script>

</body>
</html>
